<head>

<style>
:root{--bg:#fff;--card:#f3f4f8;--tx:#1a1a1a;--mu:#666;--br:#e5e7eb;--ac:#16a34a;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#222;--tx:#f2f2f2;--mu:#a3a3a3;--br:#333;--ac:#22c55e;--ac2:#06260f}}
:root[data-theme="dark"]{--bg:#141414;--card:#222;--tx:#f2f2f2;--mu:#a3a3a3;--br:#333;--ac:#22c55e;--ac2:#06260f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:820px;margin:0 auto;padding:12px 14px 90px}
.hero{background:linear-gradient(120deg,#15803d,#0f172a);color:#fff;border-radius:14px;padding:22px 18px;margin-bottom:12px}

.chips{display:flex;gap:8px;margin:10px 0;font-size:12px;color:var(--mu);flex-wrap:wrap}
.chips span{background:var(--card);padding:5px 10px;border-radius:20px}
input,textarea{width:100%;padding:11px 14px;border:1px solid var(--br);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:15px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ac);transform:scale(1.2)}
.tabs{display:flex;gap:16px;overflow-x:auto;padding:12px 2px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{background:none;border:0;color:var(--tx);font:inherit;font-size:15px;padding:4px 0;cursor:pointer;white-space:nowrap}
h2{font-size:17px;border-left:4px solid var(--ac);padding-left:10px;margin:18px 0 6px}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--br);cursor:pointer}
.em{width:56px;height:56px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:28px;flex:none}
.in{flex:1;min-width:0}.in b{font-size:15px}.in small{display:block;color:var(--mu);font-size:12.5px;margin:2px 0}
.pr{font-size:14px}
.add{width:34px;height:34px;border-radius:8px;border:0;background:var(--card);color:var(--tx);font-size:20px;cursor:pointer;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--br);display:none;z-index:10}
.btn{width:100%;display:flex;justify-content:space-between;margin:0 auto;padding:14px 18px;border:0;border-radius:12px;background:var(--ac);color:var(--ac2);font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.bar .btn{max-width:820px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 8px;display:flex;justify-content:space-between;font-size:18px}
.sh h3 button{background:none;border:0;color:var(--tx);font-size:24px;cursor:pointer}
.sh h4{margin:16px 0 6px;font-size:14px}
.sh label.f{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.op{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--br);font-size:14.5px;cursor:pointer}
.op span{flex:1}.op em{font-style:normal;color:var(--mu);font-size:13px}
.ci{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--br);font-size:14px}
.ci .n{flex:1}.ci small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:28px;height:28px;border-radius:7px;border:1px solid var(--br);background:var(--card);color:var(--tx);cursor:pointer;font-size:16px}
.row{display:flex;justify-content:space-between;font-size:14px;margin:6px 0}
.tot{font-weight:700;font-size:17px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inf{width:26px;height:26px;border-radius:50%;border:2px solid #86efac;background:rgba(255,255,255,.12);color:#fff;font:italic 700 15px Georgia,serif;cursor:pointer;vertical-align:middle;margin-left:6px;padding:0}
.st{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin:4px 0 10px}
.st.o{background:#dcfce7;color:#166534}.st.c{background:#fee2e2;color:#991b1b}
.hr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--br);font-size:14px}
.hr.today{font-weight:700;color:var(--ac)}
.ir{display:flex;gap:10px;padding:9px 0;font-size:14px}.ir b{min-width:92px}
.ir a{color:var(--ac)}
.hero{position:relative}
.admbtn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.em img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.admov{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px)}
.admov label.f{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.at{display:flex;gap:8px;margin:12px 0}
.at button,.sm{padding:8px 14px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.at button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.oc{border:1px solid var(--br);border-radius:12px;padding:12px;margin:10px 0}
.oc small{color:var(--mu)}
.bd{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:var(--card)}
.dz{border:2px dashed var(--br);border-radius:12px;padding:18px;text-align:center;color:var(--mu);cursor:pointer;margin-top:8px}
.dz.over{border-color:var(--ac);background:var(--card)}
.dz img{max-width:150px;max-height:130px;border-radius:8px}
.pri{width:92px!important;padding:7px 8px!important}
.pl{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--br)}
.pl .em{width:46px;height:46px;font-size:22px}
#closedbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:25;background:#b91c1c;color:#fff;text-align:center;font-size:15px;font-weight:600;line-height:1.4;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.25)}
body.closed #menu{opacity:.45}
body.closed .it{pointer-events:none}
body.closed .add{visibility:hidden}
body.closed .bar{display:none!important}
.hero{padding-top:54px}
.adrchip{position:absolute;top:10px;right:10px;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.admlink{background:none;border:0;color:var(--mu);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.cov{margin:10px 0;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45}
.cov.ok{background:rgba(21,128,61,.14);border:1px solid #15803d}
.cov.out{background:rgba(220,38,38,.12);border:1px solid #dc2626;font-weight:600}
.cov.unk{background:var(--card);border:1px solid var(--br);color:var(--mu)}
#ov1{z-index:21}
.tr input{flex:1;min-width:0}
.tr span{white-space:nowrap;font-size:13px;color:var(--mu)}
#ov6{z-index:22}
#opill{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:12;max-width:92%;background:var(--ac);color:var(--ac2);border:0;border-radius:24px;padding:10px 16px;font:inherit;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{display:none;position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:60;max-width:560px;margin:0 auto;background:#0f172a;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer}
.tl{display:flex;gap:6px;margin:16px 0 10px}
.tl .st{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.tl .st i{display:block;width:36px;height:36px;line-height:32px;border-radius:50%;background:var(--card);border:2px solid var(--br);margin:0 auto 6px;font-style:normal;font-size:17px}
.tl .st.done i{border-color:var(--ac)}
.tl .st.on i{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.tl .st.on{color:var(--tx);font-weight:600}
#ov5{z-index:40}
.adc{display:flex;gap:10px;align-items:center;border:1px solid var(--br);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer}
.adc.on{border-color:var(--ac);background:var(--card)}
.adc .acl{flex:1;min-width:0}.adc .acl b{display:block}.adc .acl small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adc .acb{display:flex;flex-direction:column;gap:6px}
.pk{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.pkb{padding:8px 14px;border-radius:20px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.pkb.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.pinl{font-size:13px;margin-top:8px}
.pl{flex-wrap:wrap}
.pl .pn{flex:1;min-width:120px;padding:8px 10px!important;font-size:14px}
.pl .ac{display:flex;gap:6px;width:100%;justify-content:flex-end}
.ch{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:20px}
.ch h2{flex:1;margin:0;min-width:140px}
.xr{display:flex;gap:8px;align-items:center;margin:6px 0}
.xr .xn,.xr .rn{flex:1;min-width:0}
.xr .xp{width:92px!important;flex:none}
select{padding:8px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit}
.ob{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.ob .sp{flex:1;min-width:28px}
.ab{padding:10px 16px;border-radius:10px;border:0;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.ab.go{background:var(--ac);color:var(--ac2)}
.ab.cur{background:var(--card);color:var(--tx);border:1px solid var(--br);cursor:default}
.ab.no{background:#dc2626;color:#fff}
/* ===== Tükendi (müşteri tarafı) ===== */
.it.so{cursor:default;opacity:.6}
.it.so .em{filter:grayscale(1)}
.sob{flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;background:#fee2e2;color:#991b1b}
.ci .sold{display:block;color:#dc2626;font-size:12px;font-weight:600;margin-top:4px}
/* ===== Yönetici paneli: sakin, yumuşak tasarım ===== */
:root{--adm:#f5f6f8;--sh:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--adm:#0e0e0e;--sh:none}}
:root[data-theme="dark"]{--adm:#0e0e0e;--sh:none}
.admov{background:var(--adm)}
.admov .at{background:var(--card);padding:4px;border-radius:14px;gap:4px;border:1px solid var(--br)}
.admov .at button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;color:var(--mu);font-weight:600}
.admov .at button.on{background:var(--bg);color:var(--tx);box-shadow:var(--sh)}
.admov .oc{background:var(--bg);box-shadow:var(--sh);border-radius:16px}
.pt{display:flex;gap:8px;align-items:center;margin:8px 0 12px}
.pt .btn{flex:1;width:auto;justify-content:center}
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.chip{padding:7px 13px;border-radius:20px;border:1px solid var(--br);background:var(--bg);color:var(--mu);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.hint{font-size:12.5px;color:var(--mu);line-height:1.45;margin:2px 2px 4px}
.cat{display:flex;align-items:center;gap:2px;margin:24px 2px 6px}
.cat h2{border:0;padding:0;margin:0 auto 0 0;flex:1;font-size:15px;letter-spacing:.2px}
.cat h2 small{color:var(--mu);font-weight:400;margin-left:4px}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--mu);font-size:15px;cursor:pointer;flex:none;padding:0}
.ib:hover,.ib:active{background:var(--card);color:var(--tx)}
.pc{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--br);border-radius:16px;padding:10px 8px 10px 10px;margin:8px 0;box-shadow:var(--sh);transition:background .2s}
.pc .em{width:54px;height:54px;cursor:pointer}
.pc .pi{flex:1;min-width:0;cursor:pointer}
.pc .pi b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pp{display:block;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pc .sc{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
.pc .sc small{font-size:11px;font-weight:600;color:var(--ac)}
.pc .mv{display:flex;flex-direction:column;flex:none}
.pc .mv .ib{height:26px;width:30px;font-size:13px;opacity:.7}
.pc.so{background:var(--card)}
.pc.so .em,.pc.so .pi{opacity:.5}
.pc.so .sc small{color:#dc2626}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.sw input[type=checkbox]{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;transform:none;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:#cbd0d8;border-radius:20px;transition:background .2s}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked+i{background:var(--ac)}
.sw input:checked+i:before{transform:translateX(18px)}
.fh{display:flex;align-items:center;gap:6px;margin:6px 0 4px}
.fh h3{margin:0;flex:1;font-size:19px}
.fc{background:var(--bg);border:1px solid var(--br);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--sh)}
.fc h4{margin:0 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--mu)}
.fc label.f{margin-top:14px}
.fc input:not([type=checkbox]),.fc textarea{background:var(--card);border-color:transparent}

.fc textarea{resize:vertical}
.fc .dz{margin:0;border-radius:14px;background:var(--card);padding:20px}
.fc .dz img{max-width:100%;max-height:170px}
.money{position:relative}
.money:before{content:"₺";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.money input{padding-left:30px}
.swr{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-size:15px}
.swr small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.fbar{position:sticky;bottom:0;display:flex;gap:10px;padding:16px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--adm) 35%);margin-top:10px}
.fbar .btn{flex:1;width:auto}
.fbar .sm{padding:0 18px}
/* ===== Ana ekran: ekrana tam sığan düzen ===== */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
img{max-width:100%}
.w{max-width:1100px;padding:10px 14px 90px}
.hero{padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:8px}

.chips{flex-wrap:nowrap;overflow-x:auto;margin:6px 0 8px;scrollbar-width:none}

/* ===== Mod seçici, rapor, fiş, bina tahmini ===== */

.est{outline:2px solid #f59e0b!important;background:rgba(245,158,11,.12)!important}

</head>

<script>

 {c:"Tavuk Döner",i:[

  var f=$("q").value.toLocaleLowerCase("tr"),h="",t="";

  var L=Array.isArray(lab)?lab:(lab?[lab]:[]);
  return x.opts.map(function(g){
    var has=function(c){return L.indexOf(g.t+": "+c.n)>=0||L.indexOf(c.n)>=0};
    if(g.m){var r=[];g.c.forEach(function(c,k){if(has(c))r.push(k)});return r}
    var k=-1;g.c.forEach(function(c,i){if(k<0&&has(c))k=i});return k<0?0:k;
  });
}

function normRoute(x){

}
function mDist(a,b,c,d){var r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)/2*r),y=(c-a)*r;return Math.sqrt(x*x+y*y)*6371000}

function gcands(rs){

async function estBina(lat,lng,route,seed){

  return h.map(function(x,i){return Array.isArray(x)?x.slice():[x&&x.d||def[i][0],(x&&x.o)||"",(x&&x.c)||""]});
}

  if(cfg&&cfg.apiKey&&window.firebase){
    try{
      firebase.initializeApp(cfg);DB=firebase.firestore();AU=firebase.auth();
      AU.onAuthStateChanged(function(u){
        ADMIN=!!(u&&!u.isAnonymous);UID=u?u.uid:null;
        if(ADMIN){ordWatch();cpWatch()}
        else{if(ordUnsub){ordUnsub();ordUnsub=null}ORD=[];lastOrd=null;if(cpUnsub){cpUnsub();cpUnsub=null}CPS=[]}

      });

async function ensureSeed(){if(DBEMPTY){await Promise.all(defProds().map(function(r){var id=r.id;delete r.id;return DB.doc("products/"+id).set(r)}));DBEMPTY=false}}

/* --- Toplu kayıt / silme / sıralama / kategori işlemleri --- */
async function saveMany(arr){
  if(!arr.length)return true;
  if(DB){try{await ensureSeed();
      var ws=arr.map(function(r){var d=Object.assign({},r),id=d.id;delete d.id;delete d.ex;delete d.opt;return [id,d]});
      if(DB.batch){var b=DB.batch();ws.forEach(function(w){b.set(DB.doc("products/"+w[0]),w[1])});await b.commit()}
      else await Promise.all(ws.map(function(w){return DB.doc("products/"+w[0]).set(w[1])}));
      return true}
    catch(e){alert("Kaydedilemedi ["+((e&&e.code)||e)+"]");return false}}
  arr.forEach(function(r){var i=PRODS.findIndex(function(x){return x.id===r.id});if(i<0)PRODS.push(r);else PRODS[i]=r});
  try{localStorage.setItem("prods",JSON.stringify(PRODS))}catch(e){alert("Tarayıcı depolama alanı doldu.")}
  build();return true;
}
async function delMany(ids){
  if(DB){try{await ensureSeed();
      if(DB.batch){var b=DB.batch();ids.forEach(function(id){b.delete(DB.doc("products/"+id))});await b.commit()}
      else await Promise.all(ids.map(function(id){return DB.doc("products/"+id).delete()}));
    }catch(e){alert("Silinemedi ["+((e&&e.code)||e)+"]")}return}
  PRODS=PRODS.filter(function(x){return ids.indexOf(x.id)<0});
  try{localStorage.setItem("prods",JSON.stringify(PRODS))}catch(e){}
  build();
}
function groups(){
  var sd=PRODS.slice().sort(function(a,b){return (a.o||0)-(b.o||0)}),cs=[];
  sd.forEach(function(p){if(cs.indexOf(p.c)<0)cs.push(p.c)});
  return cs.map(function(c){return sd.filter(function(p){return p.c===c})});
}
function swap(a,i,j){if(j<0||j>=a.length)return false;var t=a[i];a[i]=a[j];a[j]=t;return true}
async function applyGroups(g){
  var k=0,ch=[];
  g.forEach(function(a){a.forEach(function(p){k++;if(p.o!==k)ch.push(Object.assign({},p,{o:k}))})});
  await saveMany(ch);
}
async function catMove(gi,d){var g=groups();if(swap(g,gi,gi+d))await applyGroups(g)}
async function prodMove(id,d){
  var g=groups();
  for(var a=0;a<g.length;a++){var i=g[a].findIndex(function(p){return p.id===id});
    if(i>=0){if(swap(g[a],i,i+d))await applyGroups(g);return}}

function readTiers(){
  var out=[],seen={};
  var rows=[].slice.call(document.querySelectorAll("#tiers .tr"));
  for(var i=0;i<rows.length;i++){
    var k=parseFloat(rows[i].querySelector(".tk").value.replace(",",".")),m=parseFloat(rows[i].querySelector(".tm").value.replace(",","."));
    if(isNaN(k)&&isNaN(m))continue;
    if(!(k>0)||!(m>=0))return{err:"Kademe satırlarında km (0’dan büyük) ve minimum tutar girin."};
    if(seen[k])return{err:"Aynı mesafe için birden fazla kademe var ("+kmTxt(k)+" km)."};
    seen[k]=1;out.push({km:k,min:m});
  }
  out.sort(function(a,b){return a.km-b.km});return{list:out};
}

  var rm=FRM.map(function(e,i){return '<div class="xr"><input class="rn" placeholder="Malzeme adı (ör. Domates sos)" value="'+esc(e)+'"><button class="ib" onclick="rmDel('+i+')" aria-label="Sil">✕</button></div>'}).join("");
  return '<div class="fh"><button class="ib" style="font-size:20px" onclick="FORM=null;admDraw()" aria-label="Geri">←</button><h3>'+(isNew?'Yeni ürün':'Ürünü düzenle')+'</h3></div>'+
  '<div class="fc"><div class="dz" id="dz" ondragover="dzOver(event,true)" ondragleave="dzOver(event,false)" ondrop="dzDrop(event)" onclick="$(\'fi\').click()"></div><input type="file" id="fi" accept="image/*" style="display:none" onchange="pick(this.files[0])"></div>'+
  '<div class="fc"><h4>Temel bilgiler</h4>'+
    '<label class="f">Ürün adı</label><input id="fn" value="'+esc(f.n)+'" placeholder="Örn. Tavuk Döner Dürüm">'+
    '<label class="f">Kategori</label><input id="fc" value="'+esc(f.c)+'" placeholder="Seçin ya da yeni yazın">'+(cats?'<div class="pk">'+cats+'</div>':'')+
    '<label class="f">Açıklama</label><textarea id="fd" rows="2" placeholder="Müşterinin göreceği kısa açıklama">'+esc(f.d)+'</textarea>'+
    '<div class="g2"><div><label class="f">Fiyat</label><div class="money"><input id="fp" type="number" inputmode="decimal" value="'+(+f.p||0)+'"></div></div><div><label class="f">Simge (fotoğraf yoksa)</label><input id="fe" value="'+esc(f.e)+'"></div></div>'+
  '</div>'+
  '<div class="fc"><h4>Seçenek grupları</h4><div class="hint">Müşteri sipariş verirken seçer: Porsiyon, Boyut, Acı seviyesi, Pişirme… Kendi grubunuzu ve seçeneklerinizi yazabilirsiniz; fiyat farkını “+₺” kutusuna girin.</div>'+
    '<div id="opr">'+ogHtml()+'</div>'+
    '<div class="pk"><button class="pkb" onclick="ogAdd(\'por\')">＋ Porsiyon</button><button class="pkb" onclick="ogAdd(\'boy\')">＋ Boyut</button><button class="pkb" onclick="ogAdd(\'aci\')">＋ Acı seviyesi</button><button class="pkb" onclick="ogAdd()">＋ Kendi grubum</button></div>'+
  '</div>'+
  '<div class="fc"><h4>Ekstralar ve malzemeler</h4>'+
    '<label class="f">Ekstralar <span style="font-weight:400">(müşteri ek ücretle ekler)</span></label><div id="exr">'+ex+'</div><button class="sm" onclick="exAdd()">＋ Ekstra ekle</button>'+
    '<label class="f">Çıkarılabilir malzemeler</label><div id="rmr">'+rm+'</div><button class="sm" onclick="rmAdd()">＋ Malzeme ekle</button>'+
  '</div>'+
  '<div class="fc"><label class="swr"><span>Satışta<small>Kapatırsanız müşteriler “Tükendi” görür</small></span><span class="sw"><input type="checkbox" id="fso"'+(f.soldout?'':' checked')+'><i></i></span></label></div>'+
  (isNew?'':'<button class="admlink" style="color:#dc2626;display:block;margin:6px auto 0" onclick="formDel()">Bu ürünü sil</button>')+
  '<div class="fbar"><button class="btn" onclick="formSave()"><span>Kaydet</span><span>✓</span></button><button class="sm" onclick="FORM=null;admDraw()">İptal</button></div>';
}
async function formDel(){
  if(!FORM||!confirm("Bu ürün silinsin mi?"))return;
  await delMany([FORM.id]);FORM=null;admDraw();
}
function dzOver(e,on){e.preventDefault();$("dz").classList.toggle("over",on)}
async function dzDrop(e){e.preventDefault();dzOver(e,false);var f=(e.dataTransfer.files||[])[0];if(f)await pick(f)}
async function pick(f){if(!f||f.type.indexOf("image/")!==0)return;FIMG=await img2data(f);dzDraw()}
function dzDraw(){$("dz").innerHTML=FIMG?'<img src="'+FIMG+'" alt=""><div style="margin-top:8px;font-size:12px">Değiştirmek için tıklayın · <button class="admlink" onclick="event.stopPropagation();FIMG=\'\';dzDraw()">Kaldır</button></div>':'<div style="font-size:28px">📷</div>Fotoğraf ekle<br><small>sürükleyip bırakın ya da tıklayın</small>'}
function img2data(f,mx,q){return new Promise(function(res){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,(mx||480)/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);var x2=c.getContext("2d");x2.fillStyle="#fff";x2.fillRect(0,0,c.width,c.height);x2.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q||.75))};im.onerror=function(){res("")};im.src=r.result};r.onerror=function(){res("")};r.readAsDataURL(f)})}
async function formSave(){
  formSync();var f=FORM,n=String(f.n).trim(),c=String(f.c).trim();
  if(!n||!c){alert("Ürün adı ve kategori gerekli.");return}
  f.n=n;f.c=c;f.d=String(f.d||"").trim();f.e=String(f.e||"").trim()||"🍽️";f.img=FIMG;
  f.exs=FEX.map(function(e){return [String(e[0]).replace(/[:\n]/g," ").trim(),+e[1]||0]}).filter(function(e){return e[0]}).map(function(e){return e[0]+":"+e[1]}).join("\n");
  f.rm=FRM.map(function(x){return String(x).trim()}).filter(Boolean);
  delete f.ex;delete f.opt;delete f.por;f.soldout=!!f.soldout;
  f.opts=FOPT.map(function(g){return{t:String(g.t).trim(),m:g.m?1:0,c:g.c.map(function(c){return{n:String(c.n).trim(),p:+c.p||0}}).filter(function(c){return c.n})}}).filter(function(g){return g.t&&g.c.length});
  if(await saveProd(f)){FORM=null;admDraw()}
}
function admDraw(){
  var h='<div class="w"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="margin:0">⚙ Yönetici Paneli</h3><span><button class="sm" onclick="closeAdmin()">Siteye dön</button>'+(ADMIN?' <button class="sm" onclick="logout()">Çıkış</button>':'')+'</span></div>';
  if(!ADMIN){
    h+='<div style="max-width:340px;margin:36px auto"><label class="f">'+(AU?'E-posta':'Kullanıcı adı')+'</label><input id="au" autocomplete="username"'+(AU?' type="email"':'')+'><label class="f">Şifre</label><input id="ap" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')login()"><div style="height:14px"></div><button class="btn" onclick="login()"><span>Giriş yap</span><span>→</span></button><div id="ae" style="color:#dc2626;font-size:13px;margin-top:8px"></div></div>';
  }else{
    loadOrd();var nw=ORD.filter(function(o){return o.status==="Yeni"}).length;
    h+='<div style="margin-top:8px"><span class="st '+(DB?'o':'c')+'">'+(DB?(PERR?'Veritabanı bağlı ama okuma hatası: '+PERR+' (Firestore kurallarını yayınladınız mı?)':(ORDERR?'Siparişler okunamıyor: '+ORDERR+'. Hesap: '+esc(AU&&AU.currentUser?AU.currentUser.email:'?')+' · UID: '+esc(AU&&AU.currentUser?AU.currentUser.uid:'?')+' — bu UID Firestore kurallarındaki isAdmin listesinde yazılı olmalı, sonra Publish edin.':'Canlı veritabanı bağlı · '+ORD.length+' sipariş')):'Yerel mod: veriler yalnızca bu tarayıcıda'+(WHY?' – '+WHY:''))+'</span></div>';
    h+='<div id="cbar">'+cbarHtml()+'</div>';
    h+='<div class="at">'+[["o","Siparişler ("+nw+" yeni)"],["r","Rapor"],["p","Ürünler"],["s","Dükkan"],["t","Görünüm"],["c","İndirim"],["k","Reklamlar"]].map(function(x){return '<button class="'+(tab===x[0]?"on":"")+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</div>';
    h+=tab==="o"?'<button class="sm" onclick="admDraw()">↻ Yenile</button>'+ordHtml():tab==="s"?shopHtml():tab==="t"?themeHtml():tab==="c"?cpHtml():tab==="r"?rptHtml():tab==="k"?adsHtml():prodHtml();
  }
  $("adm").innerHTML=h+'</div>';
  if(ADMIN&&tab==="p"&&FORM)dzDraw();
  if(ADMIN&&tab==="t"){thDz();thPrev()}
  if(ADMIN&&tab==="s")lgDz();
  if(ADMIN&&tab==="k"&&ADF){adzDraw();adPrev()}
}
PRODS=defProds();loadLocal();loadShopLocal();loadAdsLocal();build();initStore();
setInterval(alarmTick,ALARM_MS);
updMin();
$("q").addEventListener("input",render);
render();upd();updateChip();
</script>
