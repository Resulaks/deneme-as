<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ağa Döner – Online Sipariş</title>
<style>
:root{--bg:#fff;--card:#f3f4f8;--tx:#1a1a1a;--mu:#666;--br:#e5e7eb;--ac:#16a34a;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#222;--tx:#f2f2f2;--mu:#a3a3a3;--br:#333;--ac:#22c55e;--ac2:#06260f}}
:root[data-theme="dark"]{--bg:#141414;--card:#222;--tx:#f2f2f2;--mu:#a3a3a3;--br:#333;--ac:#22c55e;--ac2:#06260f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:820px;margin:0 auto;padding:12px 14px 90px}
.hero{background:linear-gradient(120deg,#15803d,#0f172a);color:#fff;border-radius:14px;padding:22px 18px;margin-bottom:12px}
.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;opacity:.85;font-size:14px}
.chips{display:flex;gap:8px;margin:10px 0;font-size:12px;color:var(--mu);flex-wrap:wrap}
.chips span{background:var(--card);padding:5px 10px;border-radius:20px}
input,textarea{width:100%;padding:11px 14px;border:1px solid var(--br);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:15px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ac);transform:scale(1.2)}
.tabs{display:flex;gap:16px;overflow-x:auto;padding:12px 2px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{background:none;border:0;color:var(--tx);font:inherit;font-size:15px;padding:4px 0;cursor:pointer;white-space:nowrap}
h2{font-size:17px;border-left:4px solid var(--ac);padding-left:10px;margin:18px 0 6px}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--br);cursor:pointer}
.em{width:56px;height:56px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:28px;flex:none}
.in{flex:1;min-width:0}.in b{font-size:15px}.in small{display:block;color:var(--mu);font-size:12.5px;margin:2px 0}
.pr{font-size:14px}
.add{width:34px;height:34px;border-radius:8px;border:0;background:var(--card);color:var(--tx);font-size:20px;cursor:pointer;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--br);display:none;z-index:10}
.btn{width:100%;display:flex;justify-content:space-between;margin:0 auto;padding:14px 18px;border:0;border-radius:12px;background:var(--ac);color:var(--ac2);font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.bar .btn{max-width:820px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 8px;display:flex;justify-content:space-between;font-size:18px}
.sh h3 button{background:none;border:0;color:var(--tx);font-size:24px;cursor:pointer}
.sh h4{margin:16px 0 6px;font-size:14px}
.sh label.f{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.op{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--br);font-size:14.5px;cursor:pointer}
.op span{flex:1}.op em{font-style:normal;color:var(--mu);font-size:13px}
.ci{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--br);font-size:14px}
.ci .n{flex:1}.ci small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:28px;height:28px;border-radius:7px;border:1px solid var(--br);background:var(--card);color:var(--tx);cursor:pointer;font-size:16px}
.row{display:flex;justify-content:space-between;font-size:14px;margin:6px 0}
.tot{font-weight:700;font-size:17px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inf{width:26px;height:26px;border-radius:50%;border:2px solid #86efac;background:rgba(255,255,255,.12);color:#fff;font:italic 700 15px Georgia,serif;cursor:pointer;vertical-align:middle;margin-left:6px;padding:0}
.st{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin:4px 0 10px}
.st.o{background:#dcfce7;color:#166534}.st.c{background:#fee2e2;color:#991b1b}
.hr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--br);font-size:14px}
.hr.today{font-weight:700;color:var(--ac)}
.ir{display:flex;gap:10px;padding:9px 0;font-size:14px}.ir b{min-width:92px}
.ir a{color:var(--ac)}
.hero{position:relative}
.admbtn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.em img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.admov{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px)}
.admov label.f{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.at{display:flex;gap:8px;margin:12px 0}
.at button,.sm{padding:8px 14px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.at button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.oc{border:1px solid var(--br);border-radius:12px;padding:12px;margin:10px 0}
.oc small{color:var(--mu)}
.bd{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:var(--card)}
.dz{border:2px dashed var(--br);border-radius:12px;padding:18px;text-align:center;color:var(--mu);cursor:pointer;margin-top:8px}
.dz.over{border-color:var(--ac);background:var(--card)}
.dz img{max-width:150px;max-height:130px;border-radius:8px}
.pri{width:92px!important;padding:7px 8px!important}
.pl{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--br)}
.pl .em{width:46px;height:46px;font-size:22px}
#closedbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:25;background:#b91c1c;color:#fff;text-align:center;font-size:15px;font-weight:600;line-height:1.4;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.25)}
body.closed #menu{opacity:.45}
body.closed .it{pointer-events:none}
body.closed .add{visibility:hidden}
body.closed .bar{display:none!important}
.hero{padding-top:54px}
.adrchip{position:absolute;top:10px;right:10px;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.admlink{background:none;border:0;color:var(--mu);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.cov{margin:10px 0;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45}
.cov.ok{background:rgba(21,128,61,.14);border:1px solid #15803d}
.cov.out{background:rgba(220,38,38,.12);border:1px solid #dc2626;font-weight:600}
.cov.unk{background:var(--card);border:1px solid var(--br);color:var(--mu)}
#ov1{z-index:21}
#ov5{z-index:40}
.adc{display:flex;gap:10px;align-items:center;border:1px solid var(--br);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer}
.adc.on{border-color:var(--ac);background:var(--card)}
.adc .acl{flex:1;min-width:0}.adc .acl b{display:block}.adc .acl small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adc .acb{display:flex;flex-direction:column;gap:6px}
.pk{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.pkb{padding:8px 14px;border-radius:20px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.pkb.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.pinl{font-size:13px;margin-top:8px}
.pl{flex-wrap:wrap}
.pl .pn{flex:1;min-width:120px;padding:8px 10px!important;font-size:14px}
.pl .ac{display:flex;gap:6px;width:100%;justify-content:flex-end}
.ch{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:20px}
.ch h2{flex:1;margin:0;min-width:140px}
.xr{display:flex;gap:8px;align-items:center;margin:6px 0}
.xr .xn,.xr .rn{flex:1;min-width:0}
.xr .xp{width:92px!important;flex:none}
select{padding:8px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit}
</style>
</head>
<body>
<div class="w">
  <div class="hero"><button class="adrchip" id="adrchip" onclick="openAddr()">📍 Adres ekle</button><h1><span id="shn">Ağa Döner</span> <button class="inf" onclick="openInfo()" aria-label="İşletme bilgileri">i</button></h1><p>Sipariş verin, kapınıza gelsin. Ödeme kapıda.</p></div>
    <div class="chips"><span>🕒 20–30 dk</span><span id="minc"></span><span>💵 Kapıda nakit / kart</span></div>
  <input id="q" type="search" placeholder="Ürün ara…">
  <div class="tabs" id="tabs"></div>
  <div id="menu"></div>
  <div style="text-align:center;margin:28px 0 80px"><button class="admlink" onclick="openAdmin()">🔒 Yönetici girişi</button></div>
</div>

<div id="closedbar" role="alert"></div>

<div class="bar" id="bar"><button class="btn" onclick="openCart()"><span id="cnt"></span><span>Sepeti Gör · <span id="bt"></span></span></button></div>

<div class="admov" id="adm"></div>

<!-- İşletme bilgileri -->
<div class="ov" id="ov3" onclick="if(event.target===this)closeInfo()"><div class="sh" id="info"></div></div>

<!-- Ürün detayı -->
<div class="ov" id="ov1" onclick="if(event.target===this)closeItem()"><div class="sh" id="item"></div></div>

<!-- Teslimat adresim -->
<div class="ov" id="ov4" onclick="if(event.target===this)addrOut()"><div class="sh" id="asheet"></div></div>

<!-- Haritadan konum seç -->
<div class="ov" id="ov5"><div class="sh" id="msheet"></div></div>

<!-- Sepet (1. adım) ve Teslimat & ödeme (2. adım) -->
<div class="ov" id="ov2" onclick="if(event.target===this)closeCart()">
  <div class="sh">
    <div id="cstep1">
      <h3>Sepetim <button onclick="closeCart()" aria-label="Kapat">×</button></h3>
      <div id="cl"></div>
      <div class="row"><span>Ara toplam</span><span id="sub"></span></div>
      <div class="row"><span>Teslimat ücreti</span><span id="fee"></span></div>
      <div class="row tot"><span>Toplam</span><span id="ct"></span></div>
      <div id="minmsg" style="color:#dc2626;font-size:13px;margin-top:8px"></div>
      <div style="height:12px"></div>
      <button class="btn" onclick="goPay()"><span>Devam et</span><span>Teslimat &amp; ödeme →</span></button>
    </div>
    <div id="cstep2" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center"><button class="sm" onclick="showStep(1)">← Sepete dön</button><button onclick="closeCart()" aria-label="Kapat" style="background:none;border:0;color:var(--tx);font-size:24px;cursor:pointer">×</button></div>
      <h3 style="margin-top:10px">Teslimat &amp; Ödeme</h3>
      <div id="sum2"></div>
      <h4>Teslimat bilgileri</h4>
      <div id="cform"></div>
      <label class="op"><input type="checkbox" id="rem"><span>Bilgilerimi bu cihazda hatırla</span></label>

      <h4>Ödeme yöntemi (kapıda)</h4>
      <label class="op"><input type="radio" name="pay" value="Kapıda Nakit" checked onchange="payUI()"><span>💵 Kapıda nakit</span></label>
      <label class="op"><input type="radio" name="pay" value="Kapıda Kredi/Banka Kartı" onchange="payUI()"><span>💳 Kapıda kredi / banka kartı</span></label>
      <label class="op"><input type="radio" name="pay" value="Kapıda Yemek Kartı" onchange="payUI()"><span>🎫 Kapıda yemek kartı</span></label>
      <div id="cashbox"><label class="f">Para üstü için kaç TL vereceksiniz? (isteğe bağlı)</label><input id="cash" type="number" inputmode="numeric" placeholder="Örn. 500"></div>

      <label class="f">Sipariş notu (isteğe bağlı)</label><input id="nt">
      <div style="height:14px"></div>
      <button class="btn" onclick="send()"><span>WhatsApp ile Siparişi Gönder</span><span>→</span></button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// ====== AYARLAR: işletmeye göre değiştirin ======
var PHONE="905XXXXXXXXX";  // WhatsApp numarası (+ ve baştaki 0 olmadan)
var SHOP="Ağa Döner";
var FEE=0;                 // teslimat ücreti (₺)
var MINORDER=0;            // minimum sepet tutarı (₺)
var INFO={
  about:"Taze ve özenle hazırlanan döner çeşitleri. Siparişleriniz sıcak sıcak kapınızda.",
  addr:"Örnek Mah. Örnek Sok. No:1, Nilüfer / Bursa",
  tel:"0 (224) 000 00 00",
  area:"Nilüfer ve çevre mahalleler",
  pay:"Kapıda nakit, kredi/banka kartı, yemek kartı",
  hours:[["Pazartesi","10:00","23:00"],["Salı","10:00","23:00"],["Çarşamba","10:00","23:00"],["Perşembe","10:00","23:00"],["Cuma","10:00","23:30"],["Cumartesi","10:00","23:30"],["Pazar","11:00","22:00"]]  // kapalı gün için saatleri boş bırakın: ["Pazar","",""]
};
var DUR_EX=[["Ekstra döner",40],["Kaşar peyniri",25],["Patates cipsi",15],["Acı sos",0]];
var DUR_RM=["Domates sos","Sarımsaklı mayonez","Salatalık turşusu","Patates cipsi"];
var PORS={t:"Porsiyon",c:[["Normal",0],["1,5 porsiyon",60]]};
var MENU=[
 {c:"Tavuk Döner",i:[
  {n:"Tavuk Döner Dürüm",d:"Domates sos, sarımsaklı mayonez, salatalık turşusu ve patates cipsi",p:150,e:"🌯",rm:DUR_RM,ex:DUR_EX},
  {n:"Tavuk Döner Ekmek Arası",d:"Domates sos, sarımsaklı mayonez, salatalık turşusu ve patates cipsi",p:150,e:"🥖",rm:DUR_RM,ex:DUR_EX},
  {n:"Tavuk Döner Pilav Üstü",d:"Tereyağlı pirinç pilavı ve tavuk döner",p:180,e:"🍚",rm:["Tereyağlı pilav"],ex:[["Ekstra döner",40],["Cacık",30],["Közlenmiş biber",15]],opt:PORS},
  {n:"Tavuk Döner Zurna Dürüm",d:"Domates sos, sarımsaklı mayonez, salatalık turşusu ve patates cipsi",p:230,e:"🌯",rm:DUR_RM,ex:DUR_EX},
  {n:"Tavuk Döner Kebabı Dürüm",d:"Közlenmiş soğan, domates, yeşil biber, domates sos, sarımsaklı mayonez",p:170,e:"🌯",rm:["Közlenmiş soğan","Domates","Yeşil biber","Domates sos","Sarımsaklı mayonez"],ex:DUR_EX}]},
 {c:"Et Döner",i:[
  {n:"Et Döner Dürüm",d:"Soğan, domates, yeşil biber",p:220,e:"🌯",rm:["Soğan","Domates","Yeşil biber"],ex:[["Ekstra et döner",60],["Kaşar peyniri",25],["Acı sos",0]]},
  {n:"Et Döner Pilav Üstü",d:"Tereyağlı pirinç pilavı ve et döner",p:260,e:"🍚",rm:["Tereyağlı pilav"],ex:[["Ekstra et döner",60],["Cacık",30]],opt:PORS}]},
 {c:"Yan Lezzet",i:[
  {n:"Patates Kızartması",d:"Çıtır, orta porsiyon",p:70,e:"🍟",rm:[],ex:[["Ketçap",0],["Mayonez",0],["Acı sos",0]]},
  {n:"Cacık",d:"Ev yapımı",p:40,e:"🥣",rm:[],ex:[]}]},
 {c:"İçecek",i:[
  {n:"Ayran",d:"300 ml",p:25,e:"🥛",rm:[],ex:[]},
  {n:"Kola",d:"330 ml kutu",p:50,e:"🥤",rm:[],ex:[]},
  {n:"Su",d:"500 ml",p:15,e:"💧",rm:[],ex:[]}]}
];
// =================================================
var cart=[],cur=null;
try{cart=JSON.parse(localStorage.getItem("cart2")||"[]")}catch(e){}
function $(i){return document.getElementById(i)}
function tl(x){return "₺"+x.toLocaleString("tr-TR")}
function save(){try{localStorage.setItem("cart2",JSON.stringify(cart))}catch(e){}}
function render(){
  var f=$("q").value.toLocaleLowerCase("tr"),h="",t="";
  MENU.forEach(function(g,gi){
    t+='<button onclick="$(\'g'+gi+'\').scrollIntoView({behavior:\'smooth\'})">'+g.c+'</button>';
    var rows="";
    g.i.forEach(function(x,xi){
      if(x.n.toLocaleLowerCase("tr").indexOf(f)<0)return;
      rows+='<div class="it" onclick="openItem('+gi+','+xi+')"><div class="em">'+(x.img?'<img src="'+x.img+'" alt="">':x.e)+'</div><div class="in"><b>'+x.n+'</b><small>'+x.d+'</small><span class="pr">'+tl(x.p)+'</span></div><button class="add" aria-label="Seç">+</button></div>';
    });
    if(rows)h+='<h2 id="g'+gi+'">'+g.c+'</h2>'+rows;
  });
  $("menu").innerHTML=h||'<p style="color:var(--mu)">Ürün bulunamadı.</p>';
  $("tabs").innerHTML=t;
}
/* ---- Ürün detayı ---- */
function openItem(gi,xi){if(CFG&&CFG.closed)return;cur={gi:gi,xi:xi,rm:[],ex:[],o:0,q:1,note:"",edit:-1};drawItem();$("ov1").style.display="flex"}
function closeItem(){$("ov1").style.display="none"}
function unit(){var x=MENU[cur.gi].i[cur.xi],u=x.p;
  if(x.opt)u+=x.opt.c[cur.o][1];
  cur.ex.forEach(function(k){u+=x.ex[k][1]});return u}
function drawItem(){
  var x=MENU[cur.gi].i[cur.xi],h='<h3>'+x.e+' '+x.n+' <button onclick="closeItem()" aria-label="Kapat">×</button></h3>'+(x.img?'<img src="'+x.img+'" alt="" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin:6px 0">':'')+'<div style="color:var(--mu);font-size:13px">'+x.d+'</div>';
  if(x.opt){h+='<h4>'+x.opt.t+'</h4>';x.opt.c.forEach(function(c,k){
    h+='<label class="op"><input type="radio" name="o" '+(k==cur.o?'checked':'')+' onchange="cur.o='+k+';upBtn()"><span>'+c[0]+'</span><em>'+(c[1]?'+'+tl(c[1]):'')+'</em></label>'})}
  if(x.rm.length){h+='<h4>İçindekiler <span style="font-weight:400;color:var(--mu)">(istemediğinizin işaretini kaldırın)</span></h4>';
    x.rm.forEach(function(m,k){h+='<label class="op"><input type="checkbox"'+(cur.rm.indexOf(k)<0?' checked':'')+' onchange="tg(\'rm\','+k+')"><span>'+m+'</span></label>'})}
  if(x.ex.length){h+='<h4>Ekstralar</h4>';
    x.ex.forEach(function(m,k){h+='<label class="op"><input type="checkbox"'+(cur.ex.indexOf(k)>=0?' checked':'')+' onchange="tg(\'ex\','+k+')"><span>'+m[0]+'</span><em>'+(m[1]?'+'+tl(m[1]):'Ücretsiz')+'</em></label>'})}
  h+='<h4>Ürün notu</h4><input id="inote" value="'+esc(cur.note||"")+'" placeholder="Örn. az pişmiş, bol soslu…">';
  h+='<div style="display:flex;gap:12px;align-items:center;margin-top:16px"><span class="q"><button onclick="qty(-1)">−</button><b id="iq">'+cur.q+'</b><button onclick="qty(1)">+</button></span><button class="btn" style="flex:1" onclick="addCur()"><span>'+(cur.edit>=0?"Güncelle":"Sepete Ekle")+'</span><span id="ib"></span></button></div>';
  $("item").innerHTML=h;upBtn();
}
function tg(w,k){var a=cur[w],i=a.indexOf(k);if(i<0)a.push(k);else a.splice(i,1);upBtn()}
function qty(d){cur.q=Math.max(1,cur.q+d);$("iq").textContent=cur.q;upBtn()}
function upBtn(){$("ib").textContent=tl(unit()*cur.q)}
function addCur(){
  if(CFG&&CFG.closed){alert(closedText());closeItem();return}
  var x=MENU[cur.gi].i[cur.xi];
  var ln={gi:cur.gi,xi:cur.xi,pid:x.id,
    o:x.opt?x.opt.c[cur.o][0]:"",
    rm:cur.rm.map(function(k){return x.rm[k]}),
    ex:cur.ex.map(function(k){return x.ex[k][0]}),

/* --- Toplu kayıt / silme / sıralama / kategori işlemleri --- */
async function saveMany(arr){
  if(!arr.length)return true;
  if(DB){try{await ensureSeed();
      var ws=arr.map(function(r){var d=Object.assign({},r),id=d.id;delete d.id;delete d.ex;delete d.opt;return [id,d]});
      if(DB.batch){var b=DB.batch();ws.forEach(function(w){b.set(DB.doc("products/"+w[0]),w[1])});await b.commit()}
      else await Promise.all(ws.map(function(w){return DB.doc("products/"+w[0]).set(w[1])}));
      return true}
    catch(e){alert("Kaydedilemedi ["+((e&&e.code)||e)+"]");return false}}
  arr.forEach(function(r){var i=PRODS.findIndex(function(x){return x.id===r.id});if(i<0)PRODS.push(r);else PRODS[i]=r});
  try{localStorage.setItem("prods",JSON.stringify(PRODS))}catch(e){alert("Tarayıcı depolama alanı doldu.")}
  build();return true;
}
async function delMany(ids){
  if(DB){try{await ensureSeed();
      if(DB.batch){var b=DB.batch();ids.forEach(function(id){b.delete(DB.doc("products/"+id))});await b.commit()}
      else await Promise.all(ids.map(function(id){return DB.doc("products/"+id).delete()}));
    }catch(e){alert("Silinemedi ["+((e&&e.code)||e)+"]")}return}
  PRODS=PRODS.filter(function(x){return ids.indexOf(x.id)<0});
  try{localStorage.setItem("prods",JSON.stringify(PRODS))}catch(e){}
  build();
}
function groups(){
  var sd=PRODS.slice().sort(function(a,b){return (a.o||0)-(b.o||0)}),cs=[];
  sd.forEach(function(p){if(cs.indexOf(p.c)<0)cs.push(p.c)});
  return cs.map(function(c){return sd.filter(function(p){return p.c===c})});
}
function swap(a,i,j){if(j<0||j>=a.length)return false;var t=a[i];a[i]=a[j];a[j]=t;return true}
async function applyGroups(g){
  var k=0,ch=[];
  g.forEach(function(a){a.forEach(function(p){k++;if(p.o!==k)ch.push(Object.assign({},p,{o:k}))})});
  await saveMany(ch);
}
async function catMove(gi,d){var g=groups();if(swap(g,gi,gi+d))await applyGroups(g)}
async function prodMove(id,d){
  var g=groups();
  for(var a=0;a<g.length;a++){var i=g[a].findIndex(function(p){return p.id===id});
    if(i>=0){if(swap(g[a],i,i+d))await applyGroups(g);return}}
}
async function catRen(gi){
  var old=MENU[gi].c,n=prompt("Kategori adı:",old);if(n===null)return;n=n.trim();if(!n||n===old)return;
  await saveMany(PRODS.filter(function(p){return p.c===old}).map(function(p){return Object.assign({},p,{c:n})}));
}
async function catDel(gi){
  var c=MENU[gi].c,ids=PRODS.filter(function(p){return p.c===c}).map(function(p){return p.id});
  if(!confirm("“"+c+"” kategorisi ve içindeki "+ids.length+" ürün silinsin mi?"))return;
  await delMany(ids);
}
function catNew(){
  var n=prompt("Yeni kategori adı:");if(!n||!n.trim())return;
  openForm();FORM.c=n.trim();admDraw();
}
async function setName(id,v){
  var r=PRODS.find(function(x){return x.id===id});v=String(v||"").trim();
  if(!r)return;if(!v){admDraw();return}
  await saveProd(Object.assign({},r,{n:v}));
}

async function shopGeo(){
  var a=$("sad").value.trim();if(!a){alert("Önce yukarıdaki Adres alanını doldurun.");return}
  $("sgeo").textContent="Aranıyor…";
  var pt=a.split(",").map(function(x){return x.trim()}).filter(Boolean),qs=[a];
  if(pt.length>2)qs.push(pt.slice(1).join(", "));
  if(pt.length>3)qs.push(pt.slice(-3).join(", "));
  var r=await geocode(qs,true);
  if(!r){$("sgeo").textContent="Adres bulunamadı. Daha sade yazın (mahalle, ilçe, il) ya da “Şu anki konumumu kullan”ı deneyin.";return}
  $("slat").value=r.lat.toFixed(6);$("slng").value=r.lng.toFixed(6);
  $("sgeo").textContent="Bulundu: "+r.lat.toFixed(5)+", "+r.lng.toFixed(5)+". “Haritada kontrol et” ile doğrulayıp Kaydet’e basın.";
}
function shopGps(){
  if(!navigator.geolocation){alert("Tarayıcınız konum özelliğini desteklemiyor.");return}
  $("sgeo").textContent="Konum alınıyor…";
  navigator.geolocation.getCurrentPosition(function(p){
    $("slat").value=p.coords.latitude.toFixed(6);$("slng").value=p.coords.longitude.toFixed(6);
    $("sgeo").textContent="Konum alındı. Dükkandayken yaptıysanız Kaydet’e basın.";
  },function(){$("sgeo").textContent="Konum alınamadı (izin verilmemiş olabilir).";},{enableHighAccuracy:true,timeout:15000});
}

async function shopSave(){
  var g=function(i){return $(i).value.trim()};
  if(!g("sn")){alert("Dükkan adı boş olamaz.");return}
  var bad=false;
  var hours=[].map.call(document.querySelectorAll("#hrs .xr"),function(r,i){
    var x=r.querySelector(".hx").checked,o=r.querySelector(".ho").value,k=r.querySelector(".hc").value;
    if(!x&&(!o||!k))bad=true;
    return [CFG.hours[i][0],x?"":o,x?"":k]});
  if(bad){alert("Açık günler için açılış ve kapanış saatini girin.");return}
  var ph=normPhone(g("sph"));
  if(ph.length<11){alert("WhatsApp numarası geçersiz. Örnek: 905321234567");return}
  var la=g("slat").replace(",","."),ln=g("slng").replace(",","."),km=+g("skm").replace(",",".")||0;
  var hasLoc=la!==""&&ln!==""&&isFinite(la)&&isFinite(ln)&&Math.abs(+la)<=90&&Math.abs(+ln)<=180;
  if((la!==""||ln!=="")&&!hasLoc){alert("Enlem veya boylam geçersiz.");return}
  if(km>0&&!hasLoc){alert("Teslimat yarıçapı için dükkan konumu gerekli. “Yukarıdaki adresten bul” ya da “Şu anki konumumu kullan”ı kullanın.");return}
  var c=Object.assign({},CFG,{lat:hasLoc?+la:null,lng:hasLoc?+ln:null,km:km,shop:g("sn"),phone:ph,tel:g("stl"),addr:g("sad"),about:g("sab"),area:g("sar"),pay:g("spy"),fee:+g("sfe")||0,min:+g("smn")||0,hours:hours,msg:g("scm")});
  if(await saveShop(c))alert("Kaydedildi.");
}

function dzOver(e,on){e.preventDefault();$("dz").classList.toggle("over",on)}
async function dzDrop(e){e.preventDefault();dzOver(e,false);var f=(e.dataTransfer.files||[])[0];if(f)await pick(f)}
async function pick(f){if(!f||f.type.indexOf("image/")!==0)return;FIMG=await img2data(f);dzDraw()}
function dzDraw(){$("dz").innerHTML=FIMG?'<img src="'+FIMG+'" alt=""><div style="margin-top:6px;font-size:12px">Değiştirmek için yeni fotoğraf bırakın</div>':'📷 Fotoğrafı buraya sürükleyip bırakın<br><small>veya tıklayıp seçin</small>'}
function img2data(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.75))};im.onerror=function(){res("")};im.src=r.result};r.onerror=function(){res("")};r.readAsDataURL(f)})}
async function formSave(){
  formSync();var f=FORM,n=String(f.n).trim(),c=String(f.c).trim();

  f.rm=FRM.map(function(x){return String(x).trim()}).filter(Boolean);
  delete f.ex;delete f.opt;
  if(await saveProd(f)){FORM=null;admDraw()}
}
