<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ağa Döner – Online Sipariş</title>
<style>
:root{--bg:#fff;--card:#f3f4f8;--tx:#1a1a1a;--mu:#666;--br:#e5e7eb;--ac:#16a34a;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#222;--tx:#f2f2f2;--mu:#a3a3a3;--br:#333;--ac:#22c55e;--ac2:#06260f}}
:root[data-theme="dark"]{--bg:#141414;--card:#222;--tx:#f2f2f2;--mu:#a3a3a3;--br:#333;--ac:#22c55e;--ac2:#06260f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:820px;margin:0 auto;padding:12px 14px 90px}
.hero{background:linear-gradient(120deg,#15803d,#0f172a);color:#fff;border-radius:14px;padding:22px 18px;margin-bottom:12px}
.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;opacity:.85;font-size:14px}
.chips{display:flex;gap:8px;margin:10px 0;font-size:12px;color:var(--mu);flex-wrap:wrap}
.chips span{background:var(--card);padding:5px 10px;border-radius:20px}
input,textarea{width:100%;padding:11px 14px;border:1px solid var(--br);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:15px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ac);transform:scale(1.2)}
.tabs{display:flex;gap:16px;overflow-x:auto;padding:12px 2px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{background:none;border:0;color:var(--tx);font:inherit;font-size:15px;padding:4px 0;cursor:pointer;white-space:nowrap}
h2{font-size:17px;border-left:4px solid var(--ac);padding-left:10px;margin:18px 0 6px}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--br);cursor:pointer}
.em{width:56px;height:56px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:28px;flex:none}
.in{flex:1;min-width:0}.in b{font-size:15px}.in small{display:block;color:var(--mu);font-size:12.5px;margin:2px 0}
.pr{font-size:14px}
.add{width:34px;height:34px;border-radius:8px;border:0;background:var(--card);color:var(--tx);font-size:20px;cursor:pointer;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--br);display:none;z-index:10}
.btn{width:100%;display:flex;justify-content:space-between;margin:0 auto;padding:14px 18px;border:0;border-radius:12px;background:var(--ac);color:var(--ac2);font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.bar .btn{max-width:820px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 8px;display:flex;justify-content:space-between;font-size:18px}
.sh h3 button{background:none;border:0;color:var(--tx);font-size:24px;cursor:pointer}
.sh h4{margin:16px 0 6px;font-size:14px}
.sh label.f{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.op{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--br);font-size:14.5px;cursor:pointer}
.op span{flex:1}.op em{font-style:normal;color:var(--mu);font-size:13px}
.ci{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--br);font-size:14px}
.ci .n{flex:1}.ci small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:28px;height:28px;border-radius:7px;border:1px solid var(--br);background:var(--card);color:var(--tx);cursor:pointer;font-size:16px}
.row{display:flex;justify-content:space-between;font-size:14px;margin:6px 0}
.tot{font-weight:700;font-size:17px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inf{width:26px;height:26px;border-radius:50%;border:2px solid #86efac;background:rgba(255,255,255,.12);color:#fff;font:italic 700 15px Georgia,serif;cursor:pointer;vertical-align:middle;margin-left:6px;padding:0}
.st{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin:4px 0 10px}
.st.o{background:#dcfce7;color:#166534}.st.c{background:#fee2e2;color:#991b1b}
.hr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--br);font-size:14px}
.hr.today{font-weight:700;color:var(--ac)}
.ir{display:flex;gap:10px;padding:9px 0;font-size:14px}.ir b{min-width:92px}
.ir a{color:var(--ac)}
.hero{position:relative}
.admbtn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.em img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.admov{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px)}
.admov label.f{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.at{display:flex;gap:8px;margin:12px 0}
.at button,.sm{padding:8px 14px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.at button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.oc{border:1px solid var(--br);border-radius:12px;padding:12px;margin:10px 0}
.oc small{color:var(--mu)}
.bd{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:var(--card)}
.dz{border:2px dashed var(--br);border-radius:12px;padding:18px;text-align:center;color:var(--mu);cursor:pointer;margin-top:8px}
.dz.over{border-color:var(--ac);background:var(--card)}
.dz img{max-width:150px;max-height:130px;border-radius:8px}
.pri{width:92px!important;padding:7px 8px!important}
.pl{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--br)}
.pl .em{width:46px;height:46px;font-size:22px}
select{padding:8px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font:inherit}
</style>
</head>
<body>
<div class="w">
  <div class="hero"><button class="admbtn" onclick="openAdmin()">🔒 Yönetici</button><h1>Ağa Döner <button class="inf" onclick="openInfo()" aria-label="İşletme bilgileri">i</button></h1><p>Sipariş verin, kapınıza gelsin. Ödeme kapıda.</p></div>
  <div class="chips"><span>🕒 20–30 dk</span><span id="minc"></span><span>💵 Kapıda nakit / kart</span></div>
  <input id="q" type="search" placeholder="Ürün ara…">
  <div class="tabs" id="tabs"></div>
  <div id="menu"></div>
</div>

<div class="bar" id="bar"><button class="btn" onclick="openCart()"><span id="cnt"></span><span>Sepeti Gör · <span id="bt"></span></span></button></div>

<div class="admov" id="adm"></div>

<!-- İşletme bilgileri -->
<div class="ov" id="ov3" onclick="if(event.target===this)closeInfo()"><div class="sh" id="info"></div></div>

<!-- Ürün detayı -->
<div class="ov" id="ov1" onclick="if(event.target===this)closeItem()"><div class="sh" id="item"></div></div>

<!-- Sepet + teslimat -->
<div class="ov" id="ov2" onclick="if(event.target===this)closeCart()">
  <div class="sh">
    <h3>Sepetim <button onclick="closeCart()" aria-label="Kapat">×</button></h3>
    <div id="cl"></div>
    <div class="row"><span>Ara toplam</span><span id="sub"></span></div>
    <div class="row"><span>Teslimat ücreti</span><span id="fee"></span></div>
    <div class="row tot"><span>Toplam</span><span id="ct"></span></div>

    <h4>Teslimat bilgileri</h4>
    <label class="f">Ad Soyad</label><input id="nm" autocomplete="name">
    <label class="f">Telefon</label><input id="ph" type="tel" autocomplete="tel">
    <div class="g2">
      <div><label class="f">İlçe</label><input id="ilce"></div>
      <div><label class="f">Mahalle</label><input id="mah"></div>
    </div>
    <label class="f">Sokak / Cadde</label><input id="sok">
    <div class="g2">
      <div><label class="f">Bina No</label><input id="bina"></div>
      <div><label class="f">Kat / Daire</label><input id="daire"></div>
    </div>
    <label class="f">Adres tarifi (isteğe bağlı)</label><input id="tarif">

    <h4>Ödeme yöntemi (kapıda)</h4>
    <label class="op"><input type="radio" name="pay" value="Kapıda Nakit" checked onchange="payUI()"><span>💵 Kapıda nakit</span></label>
    <label class="op"><input type="radio" name="pay" value="Kapıda Kredi/Banka Kartı" onchange="payUI()"><span>💳 Kapıda kredi / banka kartı</span></label>
    <label class="op"><input type="radio" name="pay" value="Kapıda Yemek Kartı" onchange="payUI()"><span>🎫 Kapıda yemek kartı</span></label>
    <div id="cashbox"><label class="f">Para üstü için kaç TL vereceksiniz? (isteğe bağlı)</label><input id="cash" type="number" inputmode="numeric" placeholder="Örn. 500"></div>

    <label class="f">Sipariş notu (isteğe bağlı)</label><input id="nt">
    <div style="height:14px"></div>
    <button class="btn" onclick="send()"><span>WhatsApp ile Siparişi Gönder</span><span>→</span></button>
  </div>
</div>

<script>
// ====== AYARLAR: işletmeye göre değiştirin ======
var PHONE="905XXXXXXXXX";  // WhatsApp numarası (+ ve baştaki 0 olmadan)
var SHOP="Ağa Döner";
var FEE=0;                 // teslimat ücreti (₺)
var MINORDER=0;            // minimum sepet tutarı (₺)
var INFO={
  about:"Taze ve özenle hazırlanan döner çeşitleri. Siparişleriniz sıcak sıcak kapınızda.",
  addr:"Örnek Mah. Örnek Sok. No:1, Nilüfer / Bursa",
  tel:"0 (224) 000 00 00",
  area:"Nilüfer ve çevre mahalleler",
  pay:"Kapıda nakit, kredi/banka kartı, yemek kartı",
  hours:[["Pazartesi","10:00","23:00"],["Salı","10:00","23:00"],["Çarşamba","10:00","23:00"],["Perşembe","10:00","23:00"],["Cuma","10:00","23:30"],["Cumartesi","10:00","23:30"],["Pazar","11:00","22:00"]]  // kapalı gün için saatleri boş bırakın: ["Pazar","",""]
};
var DUR_EX=[["Ekstra döner",40],["Kaşar peyniri",25],["Patates cipsi",15],["Acı sos",0]];
var DUR_RM=["Domates sos","Sarımsaklı mayonez","Salatalık turşusu","Patates cipsi"];
var PORS={t:"Porsiyon",c:[["Normal",0],["1,5 porsiyon",60]]};
var MENU=[
 {c:"Tavuk Döner",i:[
  {n:"Tavuk Döner Dürüm",d:"Domates sos, sarımsaklı mayonez, salatalık turşusu ve patates cipsi",p:150,e:"🌯",rm:DUR_RM,ex:DUR_EX},
  {n:"Tavuk Döner Ekmek Arası",d:"Domates sos, sarımsaklı mayonez, salatalık turşusu ve patates cipsi",p:150,e:"🥖",rm:DUR_RM,ex:DUR_EX},
  {n:"Tavuk Döner Pilav Üstü",d:"Tereyağlı pirinç pilavı ve tavuk döner",p:180,e:"🍚",rm:["Tereyağlı pilav"],ex:[["Ekstra döner",40],["Cacık",30],["Közlenmiş biber",15]],opt:PORS},
  {n:"Tavuk Döner Zurna Dürüm",d:"Domates sos, sarımsaklı mayonez, salatalık turşusu ve patates cipsi",p:230,e:"🌯",rm:DUR_RM,ex:DUR_EX},
  {n:"Tavuk Döner Kebabı Dürüm",d:"Közlenmiş soğan, domates, yeşil biber, domates sos, sarımsaklı mayonez",p:170,e:"🌯",rm:["Közlenmiş soğan","Domates","Yeşil biber","Domates sos","Sarımsaklı mayonez"],ex:DUR_EX}]},
 {c:"Et Döner",i:[
  {n:"Et Döner Dürüm",d:"Soğan, domates, yeşil biber",p:220,e:"🌯",rm:["Soğan","Domates","Yeşil biber"],ex:[["Ekstra et döner",60],["Kaşar peyniri",25],["Acı sos",0]]},
  {n:"Et Döner Pilav Üstü",d:"Tereyağlı pirinç pilavı ve et döner",p:260,e:"🍚",rm:["Tereyağlı pilav"],ex:[["Ekstra et döner",60],["Cacık",30]],opt:PORS}]},
 {c:"Yan Lezzet",i:[
  {n:"Patates Kızartması",d:"Çıtır, orta porsiyon",p:70,e:"🍟",rm:[],ex:[["Ketçap",0],["Mayonez",0],["Acı sos",0]]},
  {n:"Cacık",d:"Ev yapımı",p:40,e:"🥣",rm:[],ex:[]}]},
 {c:"İçecek",i:[
  {n:"Ayran",d:"300 ml",p:25,e:"🥛",rm:[],ex:[]},
  {n:"Kola",d:"330 ml kutu",p:50,e:"🥤",rm:[],ex:[]},
  {n:"Su",d:"500 ml",p:15,e:"💧",rm:[],ex:[]}]}
];
// =================================================
var cart=[],cur=null;
try{cart=JSON.parse(localStorage.getItem("cart2")||"[]")}catch(e){}
function $(i){return document.getElementById(i)}
function tl(x){return "₺"+x.toLocaleString("tr-TR")}
function save(){try{localStorage.setItem("cart2",JSON.stringify(cart))}catch(e){}}
function render(){
  var f=$("q").value.toLocaleLowerCase("tr"),h="",t="";
  MENU.forEach(function(g,gi){
    t+='<button onclick="$(\'g'+gi+'\').scrollIntoView({behavior:\'smooth\'})">'+g.c+'</button>';
    var rows="";
    g.i.forEach(function(x,xi){
      if(x.n.toLocaleLowerCase("tr").indexOf(f)<0)return;
      rows+='<div class="it" onclick="openItem('+gi+','+xi+')"><div class="em">'+(x.img?'<img src="'+x.img+'" alt="">':x.e)+'</div><div class="in"><b>'+x.n+'</b><small>'+x.d+'</small><span class="pr">'+tl(x.p)+'</span></div><button class="add" aria-label="Seç">+</button></div>';
    });
    if(rows)h+='<h2 id="g'+gi+'">'+g.c+'</h2>'+rows;
  });
  $("menu").innerHTML=h||'<p style="color:var(--mu)">Ürün bulunamadı.</p>';
  $("tabs").innerHTML=t;
}
/* ---- Ürün detayı ---- */
function openItem(gi,xi){cur={gi:gi,xi:xi,rm:[],ex:[],o:0,q:1};drawItem();$("ov1").style.display="flex"}
function closeItem(){$("ov1").style.display="none"}
function unit(){var x=MENU[cur.gi].i[cur.xi],u=x.p;
  if(x.opt)u+=x.opt.c[cur.o][1];
  cur.ex.forEach(function(k){u+=x.ex[k][1]});return u}
function drawItem(){
  var x=MENU[cur.gi].i[cur.xi],h='<h3>'+x.e+' '+x.n+' <button onclick="closeItem()" aria-label="Kapat">×</button></h3>'+(x.img?'<img src="'+x.img+'" alt="" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin:6px 0">':'')+'<div style="color:var(--mu);font-size:13px">'+x.d+'</div>';
  if(x.opt){h+='<h4>'+x.opt.t+'</h4>';x.opt.c.forEach(function(c,k){
    h+='<label class="op"><input type="radio" name="o" '+(k==cur.o?'checked':'')+' onchange="cur.o='+k+';upBtn()"><span>'+c[0]+'</span><em>'+(c[1]?'+'+tl(c[1]):'')+'</em></label>'})}
  if(x.rm.length){h+='<h4>İçindekiler <span style="font-weight:400;color:var(--mu)">(istemediğinizin işaretini kaldırın)</span></h4>';
    x.rm.forEach(function(m,k){h+='<label class="op"><input type="checkbox" checked onchange="tg(\'rm\','+k+')"><span>'+m+'</span></label>'})}
  if(x.ex.length){h+='<h4>Ekstralar</h4>';
    x.ex.forEach(function(m,k){h+='<label class="op"><input type="checkbox" onchange="tg(\'ex\','+k+')"><span>'+m[0]+'</span><em>'+(m[1]?'+'+tl(m[1]):'Ücretsiz')+'</em></label>'})}
  h+='<h4>Ürün notu</h4><input id="inote" placeholder="Örn. az pişmiş, bol soslu…">';
  h+='<div style="display:flex;gap:12px;align-items:center;margin-top:16px"><span class="q"><button onclick="qty(-1)">−</button><b id="iq">1</b><button onclick="qty(1)">+</button></span><button class="btn" style="flex:1" onclick="addCur()"><span>Sepete Ekle</span><span id="ib"></span></button></div>';
  $("item").innerHTML=h;upBtn();
}
function tg(w,k){var a=cur[w],i=a.indexOf(k);if(i<0)a.push(k);else a.splice(i,1);upBtn()}
function qty(d){cur.q=Math.max(1,cur.q+d);$("iq").textContent=cur.q;upBtn()}
function upBtn(){$("ib").textContent=tl(unit()*cur.q)}
function addCur(){
  var x=MENU[cur.gi].i[cur.xi];
  cart.push({gi:cur.gi,xi:cur.xi,pid:x.id,
    o:x.opt?x.opt.c[cur.o][0]:"",
    rm:cur.rm.map(function(k){return x.rm[k]}),
    ex:cur.ex.map(function(k){return x.ex[k][0]}),
    note:$("inote").value.trim(),u:unit(),q:cur.q});
  save();closeItem();upd();
}
/* ---- Sepet ---- */
function sum(){var n=0,s=0;cart.forEach(function(l){n+=l.q;s+=l.u*l.q});return{n:n,s:s}}
function upd(){var t=sum();$("bar").style.display=t.n?"block":"none";$("cnt").textContent=t.n+" ürün";$("bt").textContent=tl(t.s)}
function det(l){var a=[];if(l.o)a.push(l.o);if(l.rm.length)a.push("Çıkar: "+l.rm.join(", "));if(l.ex.length)a.push("Ekstra: "+l.ex.join(", "));if(l.note)a.push("Not: "+l.note);return a}
function drawCart(){
  var h="";cart.forEach(function(l,i){var x=MENU[l.gi].i[l.xi],d=det(l);
    h+='<div class="ci"><div class="n"><b>'+x.n+'</b>'+(d.length?'<small>'+d.join(" · ")+'</small>':'')+'</div><span class="q"><button onclick="chg('+i+',-1)">−</button>'+l.q+'<button onclick="chg('+i+',1)">+</button></span><b style="min-width:60px;text-align:right">'+tl(l.u*l.q)+'</b></div>'});
  $("cl").innerHTML=h||'<p style="color:var(--mu)">Sepetiniz boş.</p>';
  var s=sum().s;$("sub").textContent=tl(s);$("fee").textContent=FEE?tl(FEE):"Ücretsiz";$("ct").textContent=tl(s+FEE);
  if(!cart.length)closeCart();
}
function chg(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);save();upd();drawCart()}
function openCart(){drawCart();payUI();$("ov2").style.display="flex"}
function closeCart(){$("ov2").style.display="none"}
function pay(){return document.querySelector('input[name=pay]:checked').value}
function payUI(){$("cashbox").style.display=pay()==="Kapıda Nakit"?"block":"none"}
function send(){
  var t=sum();if(!t.n)return;
  var v=function(i){return $(i).value.trim()};
  if(!v("nm")||!v("ph")||!v("ilce")||!v("mah")||!v("sok")||!v("bina")){alert("Lütfen ad, telefon, ilçe, mahalle, sokak ve bina no alanlarını doldurun.");return}
  if(t.s<MINORDER){alert("Minimum sipariş tutarı "+tl(MINORDER)+".");return}
  var m="*Yeni Sipariş – "+SHOP+"*\n\n";
  cart.forEach(function(l){var x=MENU[l.gi].i[l.xi];
    m+=l.q+" x "+x.n+" – "+tl(l.u*l.q)+"\n";
    det(l).forEach(function(d){m+="   • "+d+"\n"})});
  m+="\nAra toplam: "+tl(t.s)+"\nTeslimat: "+(FEE?tl(FEE):"Ücretsiz")+"\n*Toplam: "+tl(t.s+FEE)+"*\n";
  m+="\n*Ödeme:* "+pay();
  if(pay()==="Kapıda Nakit"&&v("cash"))m+=" (para üstü için "+tl(+v("cash"))+" verilecek)";
  m+="\n\n*Ad:* "+v("nm")+"\n*Tel:* "+v("ph")+"\n*Adres:* "+v("mah")+" Mah. "+v("sok")+" No:"+v("bina")+(v("daire")?" Kat/Daire: "+v("daire"):"")+", "+v("ilce");
  if(v("tarif"))m+="\n*Tarif:* "+v("tarif");
  if(v("nt"))m+="\n*Not:* "+v("nt");
  var addr=v("mah")+" Mah. "+v("sok")+" No:"+v("bina")+(v("daire")?" Kat/Daire: "+v("daire"):"")+", "+v("ilce")+(v("tarif")?" ("+v("tarif")+")":"");
  var pm=pay()+((pay()==="Kapıda Nakit"&&v("cash"))?" (para üstü için "+tl(+v("cash"))+")":"");
  saveOrder({id:"o"+Date.now(),ts:Date.now(),name:v("nm"),phone:v("ph"),addr:addr,pay:pm,note:v("nt"),sub:t.s,fee:FEE,total:t.s+FEE,status:"Yeni",items:cart.map(function(l){return {n:MENU[l.gi].i[l.xi].n,q:l.q,u:l.u,d:det(l)}})});
  window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(m),"_blank");
  cart=[];save();upd();closeCart();
}
function mm(s){var a=s.split(":");return +a[0]*60+ +a[1]}
function openInfo(){
  var n=new Date(),ti=(n.getDay()+6)%7,mi=n.getHours()*60+n.getMinutes(),h=INFO.hours[ti],open=false;
  if(h[1]){var o=mm(h[1]),c=mm(h[2]);open=c>o?(mi>=o&&mi<c):(mi>=o||mi<c)}
  var s='<h3>'+SHOP+' <button onclick="closeInfo()" aria-label="Kapat">×</button></h3>';
  s+='<span class="st '+(open?'o':'c')+'">'+(open?'Şu an açık':'Şu an kapalı')+'</span>';
  s+='<div style="color:var(--mu);font-size:14px">'+INFO.about+'</div>';
  s+='<h4>Çalışma saatleri</h4>';
  INFO.hours.forEach(function(x,i){s+='<div class="hr'+(i==ti?' today':'')+'"><span>'+x[0]+'</span><span>'+(x[1]?x[1]+' – '+x[2]:'Kapalı')+'</span></div>'});
  s+='<h4>İletişim ve teslimat</h4>';
  s+='<div class="ir"><b>📍 Adres</b><span>'+INFO.addr+'</span></div>';
  s+='<div class="ir"><b>📞 Telefon</b><a href="tel:'+INFO.tel.replace(/[^0-9+]/g,'')+'">'+INFO.tel+'</a></div>';
  s+='<div class="ir"><b>🛵 Teslimat</b><span>'+INFO.area+' · Min. '+tl(MINORDER)+' · '+(FEE?tl(FEE):'Ücretsiz')+'</span></div>';
  s+='<div class="ir"><b>💵 Ödeme</b><span>'+INFO.pay+'</span></div>';
  $("info").innerHTML=s;$("ov3").style.display="flex";
}
function closeInfo(){$("ov3").style.display="none"}
/* ===== VERİ KATMANI + YÖNETİCİ PANELİ ===== */
var ADMIN_USER="admin",ADMIN_PASS="admin123";   // yönetici girişi (şimdilik)
var DEF=JSON.parse(JSON.stringify(MENU)),DB=null,UID=null,PRODS=[],DBEMPTY=false,ADMIN=false,ORD=[],ordUnsub=null,tab="o",FORM=null,FIMG="";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function defProds(){var a=[],k=0;DEF.forEach(function(g){g.i.forEach(function(x){var r=JSON.parse(JSON.stringify(x));r.c=g.c;r.id="p"+(++k);r.o=k;r.exs=(x.ex||[]).map(function(e){return e[0]+":"+e[1]}).join("\n");r.por=x.opt?1:0;delete r.ex;delete r.opt;a.push(r)})});return a}
function parseEx(s){return String(s||"").split("\n").map(function(t){return t.trim()}).filter(Boolean).map(function(t){var i=t.lastIndexOf(":");return i<0?[t,0]:[t.slice(0,i).trim(),+t.slice(i+1)||0]})}
function build(){
  var g={},ord=[];
  PRODS.slice().sort(function(a,b){return (a.o||0)-(b.o||0)}).forEach(function(r){
    r.rm=r.rm||[];r.ex=parseEx(r.exs);r.opt=r.por?PORS:null;
    if(r.img&&String(r.img).indexOf("data:image/")!==0)r.img="";
    if(!g[r.c]){g[r.c]={c:r.c,i:[]};ord.push(g[r.c])}g[r.c].i.push(r)});
  MENU=ord;
  cart=cart.map(function(l){for(var a=0;a<MENU.length;a++)for(var b=0;b<MENU[a].i.length;b++)if(MENU[a].i[b].id===l.pid){l.gi=a;l.xi=b;return l}return null}).filter(Boolean);
  save();render();upd();
  if($("adm").style.display==="block"&&!FORM)admDraw();
}
function loadLocal(){try{var a=JSON.parse(localStorage.getItem("prods")||"null");if(a&&a.length)PRODS=a}catch(e){}}
async function initStore(){
  try{if(window.claude){var u=await claude.use("user");if(u){try{UID=await u.id()}catch(e){}}DB=await claude.use("db")}}catch(e){DB=null}
  if(!DB)return;
  DB.collection("products").onSnapshot(function(s){
    DBEMPTY=s.empty;
    PRODS=s.empty?defProds():s.docs.map(function(d){var r=Object.assign({},d.data());r.id=d.id;return r});
    build();
  },function(){});
}
async function ensureSeed(){if(DBEMPTY){await Promise.all(defProds().map(function(r){var id=r.id;delete r.id;return DB.doc("products/"+id).set(r)}));DBEMPTY=false}}
async function saveProd(r){
  if(DB){try{await ensureSeed();var d=Object.assign({},r);delete d.id;delete d.ex;delete d.opt;await DB.doc("products/"+r.id).set(d);return true}
    catch(e){alert("Kaydedilemedi. Ürünleri değiştirmek için sayfanın sahibi/editörü olarak giriş yapmış olmanız gerekir.");return false}}
  var i=PRODS.findIndex(function(x){return x.id===r.id});if(i<0)PRODS.push(r);else PRODS[i]=r;
  try{localStorage.setItem("prods",JSON.stringify(PRODS))}catch(e){alert("Tarayıcı depolama alanı doldu. Fotoğraf sayısını azaltın.")}
  build();return true;
}
async function delProd(id){
  if(!confirm("Bu ürün silinsin mi?"))return;
  if(DB){try{await ensureSeed();await DB.doc("products/"+id).delete()}catch(e){alert("Silinemedi (yetki).")}return}
  PRODS=PRODS.filter(function(x){return x.id!==id});try{localStorage.setItem("prods",JSON.stringify(PRODS))}catch(e){}build();
}
async function setPrice(id,v){var r=PRODS.find(function(x){return x.id===id});if(r)await saveProd(Object.assign({},r,{p:+v||0}))}
/* --- Siparişler --- */
async function saveOrder(o){
  if(DB&&UID){try{var ref=DB.doc("orders/"+UID),s=await ref.get(),l=(s.exists&&s.data().list)||[];await ref.set({uid:UID,list:l.concat([o]).slice(-30)});return}catch(e){}}
  try{var a=JSON.parse(localStorage.getItem("orders")||"[]");a.unshift(o);localStorage.setItem("orders",JSON.stringify(a.slice(0,200)))}catch(e){}
}
function loadOrd(){if(!DB){try{ORD=JSON.parse(localStorage.getItem("orders")||"[]")}catch(e){ORD=[]}}}
function ordWatch(){
  if(!DB||ordUnsub)return;
  ordUnsub=DB.collection("orders").onSnapshot(function(s){
    var a=[];s.docs.forEach(function(d){((d.data()||{}).list||[]).forEach(function(o){a.push(Object.assign({},o,{uid:d.id}))})});
    ORD=a.sort(function(x,y){return y.ts-x.ts});
    if(ADMIN&&tab==="o"&&$("adm").style.display==="block")admDraw();
  },function(){});
}
async function ordWrite(o,fn){
  if(DB&&o.uid){try{var r=DB.doc("orders/"+o.uid),s=await r.get();await r.set({uid:o.uid,list:fn((s.data()||{}).list||[])})}catch(e){alert("İşlem yapılamadı (yetki).")}return}
  try{localStorage.setItem("orders",JSON.stringify(fn(JSON.parse(localStorage.getItem("orders")||"[]"))))}catch(e){}
  admDraw();
}
function ordStatus(i,v){var o=ORD[i];ordWrite(o,function(l){l.forEach(function(x){if(x.id===o.id)x=Object.assign(x,{status:v})});return l.map(function(x){return x.id===o.id?Object.assign({},x,{status:v}):x})})}
function ordDel(i){if(!confirm("Bu sipariş silinsin mi?"))return;var o=ORD[i];ordWrite(o,function(l){return l.filter(function(x){return x.id!==o.id})})}
/* --- Panel arayüzü --- */
function openAdmin(){try{ADMIN=sessionStorage.getItem("adm")==="1"}catch(e){}$("adm").style.display="block";if(ADMIN)ordWatch();admDraw()}
function closeAdmin(){$("adm").style.display="none"}
function login(){if($("au").value.trim()===ADMIN_USER&&$("ap").value===ADMIN_PASS){ADMIN=true;try{sessionStorage.setItem("adm","1")}catch(e){}ordWatch();admDraw()}else $("ae").textContent="Kullanıcı adı veya şifre hatalı."}
function logout(){ADMIN=false;FORM=null;try{sessionStorage.removeItem("adm")}catch(e){}admDraw()}
function setTab(t){tab=t;FORM=null;admDraw()}
function ordHtml(){
  if(!ORD.length)return '<p style="color:var(--mu)">Henüz sipariş yok.</p>';
  var S=["Yeni","Hazırlanıyor","Yolda","Teslim edildi","İptal"];
  return ORD.map(function(o,i){
    return '<div class="oc"><div class="row"><b>'+esc(o.name)+'</b><span class="bd">'+esc(o.status)+'</span></div><small>'+new Date(o.ts).toLocaleString("tr-TR")+'</small>'+
    '<div style="margin:8px 0">'+(o.items||[]).map(function(x){return '<div class="row"><span>'+esc(x.q)+' x '+esc(x.n)+((x.d&&x.d.length)?'<small style="display:block">'+esc(x.d.join(" · "))+'</small>':'')+'</span><span>'+tl((+x.u||0)*(+x.q||0))+'</span></div>'}).join("")+'</div>'+
    '<div class="row tot"><span>Toplam</span><span>'+tl(+o.total||0)+'</span></div>'+
    '<div class="ir"><b style="min-width:28px">📞</b><a href="tel:'+esc(String(o.phone).replace(/[^0-9+]/g,""))+'">'+esc(o.phone)+'</a></div>'+
    '<div class="ir"><b style="min-width:28px">📍</b><span>'+esc(o.addr)+'</span></div>'+
    '<div class="ir"><b style="min-width:28px">💳</b><span>'+esc(o.pay)+'</span></div>'+(o.note?'<div class="ir"><b style="min-width:28px">📝</b><span>'+esc(o.note)+'</span></div>':'')+
    '<select onchange="ordStatus('+i+',this.value)">'+S.map(function(x){return '<option'+(x===o.status?' selected':'')+'>'+x+'</option>'}).join("")+'</select> <button class="sm" onclick="ordDel('+i+')">Sil</button></div>'}).join("");
}
function prodHtml(){
  if(FORM)return formHtml();
  var h='<button class="btn" style="margin:8px 0 4px" onclick="openForm()"><span>+ Yeni ürün ekle</span><span></span></button>';
  MENU.forEach(function(g){h+='<h2>'+esc(g.c)+'</h2>';g.i.forEach(function(r){
    h+='<div class="pl"><div class="em">'+(r.img?'<img src="'+r.img+'" alt="">':esc(r.e))+'</div><div style="flex:1;min-width:0;font-size:14px"><b>'+esc(r.n)+'</b></div><input class="pri" type="number" value="'+(+r.p||0)+'" onchange="setPrice(\''+esc(r.id)+'\',this.value)"><button class="sm" onclick="openForm(\''+esc(r.id)+'\')">Düzenle</button><button class="sm" onclick="delProd(\''+esc(r.id)+'\')">Sil</button></div>'})});
  return h;
}
function openForm(id){
  var r=id?PRODS.find(function(x){return x.id===id}):null;
  FORM=r?Object.assign({},r):{id:"p"+Date.now(),c:"",n:"",d:"",p:0,e:"🍽️",img:"",rm:[],exs:"",por:0,o:Math.max.apply(null,PRODS.map(function(x){return x.o||0}).concat(0))+1};
  FIMG=FORM.img||"";admDraw();
}
function formHtml(){
  var f=FORM,cats=MENU.map(function(g){return '<option value="'+esc(g.c)+'">'}).join("");
  return '<h4>Ürün bilgileri</h4><div class="dz" id="dz" ondragover="dzOver(event,true)" ondragleave="dzOver(event,false)" ondrop="dzDrop(event)" onclick="$(\'fi\').click()"></div><input type="file" id="fi" accept="image/*" style="display:none" onchange="pick(this.files[0])">'+
  '<label class="f">Ürün adı</label><input id="fn" value="'+esc(f.n)+'">'+
  '<label class="f">Kategori</label><input id="fc" list="cl" value="'+esc(f.c)+'"><datalist id="cl">'+cats+'</datalist>'+
  '<label class="f">Açıklama</label><input id="fd" value="'+esc(f.d)+'">'+
  '<div class="g2"><div><label class="f">Fiyat (₺)</label><input id="fp" type="number" value="'+(+f.p||0)+'"></div><div><label class="f">Simge (fotoğraf yoksa)</label><input id="fe" value="'+esc(f.e)+'"></div></div>'+
  '<label class="f">Çıkarılabilir malzemeler (virgülle ayırın)</label><input id="frm" value="'+esc((f.rm||[]).join(", "))+'">'+
  '<label class="f">Ekstralar (her satıra bir tane: Ad:Fiyat)</label><textarea id="fx" rows="3" placeholder="Ekstra döner:40&#10;Kaşar peyniri:25">'+esc(f.exs||"")+'</textarea>'+
  '<label class="op"><input type="checkbox" id="fpor"'+(f.por?' checked':'')+'><span>Porsiyon seçeneği ekle (Normal / 1,5 porsiyon +₺60)</span></label>'+
  '<div style="display:flex;gap:10px;margin-top:14px"><button class="btn" onclick="formSave()"><span>Kaydet</span><span>✓</span></button><button class="sm" onclick="FORM=null;admDraw()">İptal</button></div>';
}
function dzOver(e,on){e.preventDefault();$("dz").classList.toggle("over",on)}
async function dzDrop(e){e.preventDefault();dzOver(e,false);var f=(e.dataTransfer.files||[])[0];if(f)await pick(f)}
async function pick(f){if(!f||f.type.indexOf("image/")!==0)return;FIMG=await img2data(f);dzDraw()}
function dzDraw(){$("dz").innerHTML=FIMG?'<img src="'+FIMG+'" alt=""><div style="margin-top:6px;font-size:12px">Değiştirmek için yeni fotoğraf bırakın</div>':'📷 Fotoğrafı buraya sürükleyip bırakın<br><small>veya tıklayıp seçin</small>'}
function img2data(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.75))};im.onerror=function(){res("")};im.src=r.result};r.onerror=function(){res("")};r.readAsDataURL(f)})}
async function formSave(){
  var f=FORM,n=$("fn").value.trim(),c=$("fc").value.trim();
  if(!n||!c){alert("Ürün adı ve kategori gerekli.");return}
  f.n=n;f.c=c;f.d=$("fd").value.trim();f.p=+$("fp").value||0;f.e=$("fe").value.trim()||"🍽️";f.img=FIMG;
  f.rm=$("frm").value.split(",").map(function(x){return x.trim()}).filter(Boolean);f.exs=$("fx").value.trim();f.por=$("fpor").checked?1:0;
  delete f.ex;delete f.opt;
  if(await saveProd(f)){FORM=null;admDraw()}
}
function admDraw(){
  var h='<div class="w"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="margin:0">⚙ Yönetici Paneli</h3><span><button class="sm" onclick="closeAdmin()">Siteye dön</button>'+(ADMIN?' <button class="sm" onclick="logout()">Çıkış</button>':'')+'</span></div>';
  if(!ADMIN){
    h+='<div style="max-width:340px;margin:36px auto"><label class="f">Kullanıcı adı</label><input id="au" autocomplete="username"><label class="f">Şifre</label><input id="ap" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')login()"><div style="height:14px"></div><button class="btn" onclick="login()"><span>Giriş yap</span><span>→</span></button><div id="ae" style="color:#dc2626;font-size:13px;margin-top:8px"></div></div>';
  }else{
    loadOrd();var nw=ORD.filter(function(o){return o.status==="Yeni"}).length;
    h+='<div style="margin-top:8px"><span class="st '+(DB?'o':'c')+'">'+(DB?'Canlı veritabanı bağlı':'Yerel mod: veriler yalnızca bu tarayıcıda')+'</span></div>';
    h+='<div class="at"><button class="'+(tab==="o"?"on":"")+'" onclick="setTab(\'o\')">Siparişler ('+nw+' yeni)</button><button class="'+(tab==="p"?"on":"")+'" onclick="setTab(\'p\')">Ürünler</button></div>';
    h+=tab==="o"?'<button class="sm" onclick="admDraw()">↻ Yenile</button>'+ordHtml():prodHtml();
  }
  $("adm").innerHTML=h+'</div>';
  if(ADMIN&&tab==="p"&&FORM)dzDraw();
}
PRODS=defProds();loadLocal();build();initStore();
$("minc").textContent="💳 Min. "+tl(MINORDER);
$("q").addEventListener("input",render);
render();upd();
</script>
</body>
</html>
